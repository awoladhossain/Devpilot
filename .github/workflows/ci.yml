
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devpilot
          POSTGRES_PASSWORD: devpilot
          POSTGRES_DB: devpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t devpilot:ci .

      - name: Start database
        run: |
          set -euo pipefail
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_USER=devpilot \
            -e POSTGRES_PASSWORD=devpilot \
            -e POSTGRES_DB=devpilot \
            --health-cmd "pg_isready -U devpilot -d devpilot" \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 10 \
            postgres:17
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' db)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs db
          exit 1

      - name: Run API and check health
        run: |
          set -euo pipefail
          docker run -d --name api --network ci \
            -e DATABASE_URL=postgresql+psycopg://devpilot:devpilot@db:5432/devpilot \
            -p 127.0.0.1:8000:8000 \
            devpilot:ci
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS http://127.0.0.1:8000/health/db || true)" = '{"status":"ok"}' ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

