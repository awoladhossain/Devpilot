services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpilot}
      POSTGRES_DB: ${POSTGRES_DB:-devpilot}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-devpilot}:${POSTGRES_PASSWORD:-devpilot}@db:5432/${POSTGRES_DB:-devpilot}
    ports:
      - "127.0.0.1:8050:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
